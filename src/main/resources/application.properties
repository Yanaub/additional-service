server.port=8081
crud.service.url=http://museum-app:8080

observability.window.short=10
observability.window.medium=30
observability.window.long=60
observability.schedule.ms=10000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState


resilience4j.circuitbreaker.instances.callCoreServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.callCoreServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.callCoreServiceCB.wait-duration-in-open-state=PT30S
resilience4j.circuitbreaker.instances.callCoreServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.callCoreServiceCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.callCoreServiceCB.record-exceptions=org.springframework.web.client.ResourceAccessException,java.net.ConnectException,java.util.concurrent.TimeoutException

