fixedRate.in.milliseconds=1000
statisticsservice.infostring=LINES
statistics.service=console2000

spring.datasource.url=jdbc:postgresql://localhost:5432/museum
spring.datasource.username=museum_user
spring.datasource.password=museum_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true