version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: museum_postgres
    environment:
      POSTGRES_DB: museum
      POSTGRES_USER: museum_user
      POSTGRES_PASSWORD: museum_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - museum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum_user -d museum"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: museum_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - museum-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: museum_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/museum
      - SPRING_DATASOURCE_USERNAME=museum_user
      - SPRING_DATASOURCE_PASSWORD=museum_pass
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration

    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  museum-network:
    driver: bridge

volumes:
  postgres_data: